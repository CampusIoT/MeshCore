# Route the Zephyr console (boot log, BLE PIN, radio_set_params + multi-SF diagnostics) to the
# SWD probe via SEGGER RTT instead of UART. The nRF54L15 has no USB, so this is how you read the
# console. Build with:  west build ... -- -DEXTRA_CONF_FILE=rtt.conf   then:  pyocd rtt -t nrf54l
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
